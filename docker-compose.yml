version: '3.8'

services: 
  mongodb:
    image: mongo:6.0
    container_name: wishlist_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - wishlist_net

  redis:
    image: redis:7-alpine
    container_name: wishlist_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wishlist_net

  neo4j:
    image: neo4j:5
    container_name: wishlist_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/testpassword123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - wishlist_net

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: wishlist_redisinsight
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - redisinsight_data:/db
    networks:
      - wishlist_net

  wishlist-service:
    build:
      context: .
      dockerfile: wishlist_api/Dockerfile
    container_name: wishlist_api
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword123
    depends_on:
      - mongodb
      - redis
      - neo4j
    networks:
      - wishlist_net

  reco-service:
    build:
      context: .
      dockerfile: reco_api/Dockerfile
    container_name: reco_api
    restart: unless-stopped
    ports:
      - "8081:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword123
    depends_on:
      - mongodb
      - redis
      - neo4j
    networks:
      - wishlist_net

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  redisinsight_data:

networks:
  wishlist_net:
    driver: bridge
